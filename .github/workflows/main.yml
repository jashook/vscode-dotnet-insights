# CI: compiles, lints, and runs the .NET Insights extension's test suite
# (dotnetInsights/) on every pull request targeting master and on every push
# to master.

name: CI

on:
  pull_request:
    branches: [ master ]

  push:
    branches: [ master ]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dotnetInsights

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dotnetInsights/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm test's pretest script runs compile + lint first; the VS Code
      # Extension Development Host the test suite launches needs a display,
      # which GitHub's ubuntu-latest runners don't have by default - xvfb-run
      # provides a virtual one (it ships preinstalled on the hosted image).
      - name: Compile, lint, and run tests
        run: xvfb-run -a npm test
